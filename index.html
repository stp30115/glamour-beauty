            color: white;
            font-size: 55px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .whatsapp-badge:active {
            transform: scale(0.95);
        }
        @keyframes pulse {
            0% {

            margin-bottom: 35px;
        }
        .whatsapp-btn {

            color: white;

            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);

        .whatsapp-btn:active {
