<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour beauty - تواصل معنا</title>
    <!-- استيراد خط تجوال لتصميم عربي ممتاز -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- استيراد مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
        }
        /* الشريط العلوي */
        .top-bar {
            width: 100%;
            background-color: #25D366;
            color: white;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        /* المحتوى الرئيسي */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            margin: auto;
        }
        /* أيقونة المتجر البارزة */
        .store-icon-container {
            width: 90px;
            height: 90px;
            background-color: #25D366;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            color: white;
            font-size: 40px;
        }
        /* اسم المتجر */
        .store-name {
            font-size: 28px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .store-subtitle {
            font-size: 15px;
            color: #777777;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* أيقونة الواتساب الكبيرة الدائرية */
        .whatsapp-badge {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.4);
            animation: pulse 2s infinite;
            color: white;
            font-size: 55px;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }
        /* العناوين والنصوص الإرشادية */
        .action-title {
            font-size: 26px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 8px;
        }
        .action-subtitle {
            font-size: 16px;
            color: #555555;
            margin-bottom: 35px;
            font-weight: 400;
        }
        .description-text {
            font-size: 14px;
            color: #888888;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        /* زر مراسلتنا السفلي */
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #25D366;
            color: white;
            width: 100%;
            max-width: 380px;
            padding: 16px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
            transition: all 0.3s ease;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.45);
        }
        .whatsapp-btn i:first-child {
            font-size: 24px;
        }
        .whatsapp-btn i:last-child {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        تواصل معنا الآن عبر واتساب
    </div>

    <!-- المحتوى -->
    <div class="main-content">
        
        <!-- أيقونة المتجر في الأعلى -->
        <div class="store-icon-container">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>

        <h1 class="store-name">Glamour beauty</h1>
        <div class="store-subtitle">Official Store</div>

        <!-- دائرة الواتساب النابضة -->
        <div class="whatsapp-badge">
            <i class="fa-brands fa-whatsapp"></i>
        </div>

        <div class="action-title">اضغط هنا</div>
        <div class="action-subtitle">وتواصل معنا عبر واتساب</div>
        
        <div class="description-text">
            نحن جاهزون للرد على استفساراتك ومساعدتك في طلب المنتج بكل فاعلية وسرعة.
        </div>

        <!-- الزر التفاعلي للواتساب برقمك -->
        <a href="https://wa.me/972567728417" class="whatsapp-btn" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            <span>مراسلَتُنا عبر واتساب</span>
            <i class="fa-solid fa-chevron-left"></i>
        </a>

    </div>

    <div style="height: 30px;"></div>

</body>
</html>
